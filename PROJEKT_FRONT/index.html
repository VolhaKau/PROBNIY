<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная</title>
  <link rel="stylesheet" href="style.css" media="screen">
</head>

<body>
  <header class="header">
    <div>
      <img alt="logo" src="image/logo.png" class="logo">
      <button class="theme"></button>
      <input type="text" placeholder="Поиск">
      <button class="search-btn" aria-label="Поиск">🔍</button>
      <a href="#" class="profile-btn">Личный кабинет</a>

      <!--notification bell-->
      <div class="notification-bell">
        <button>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
      </div>
      
      <!--language flags-->
      <button><img alt="flag" src="image/flags/ru_flag.png"></button>
    </div>
  </header>

  <!--information banner-->
  <div>
    <img alt="banner" src="#" class="info-banner">
  </div>

  <h2>Каталог</h2>

  <div class="main-catalog">
    <button>Оборудование</button>
    <button>Методические указания</button>
  </div>

  <div class="side-catalog">
    <button><--</button>
    <button>Периферия и датчики</button>
    <button>Микроконтроллеры и отладочные материалы</button>
    <button>Мультимедиа и оптика</button>
    <button>Инструменты и монтаж</button>
    <button>Сетевое оборудование</button>
  </div>

  <!--form block-->
  <div class="form">
    <div>
      <p>Не нашли нужное оборудование?</p>
      <p>Расскажите о своей задаче – оставьте запрос в Goole-форме.</p>
    </div>
    <a href="#" class="form-link">Запросить оборудование</a>
  </div>
</body>

</html>
